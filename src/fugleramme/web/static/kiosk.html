<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Fugleramme</title>
<!-- Inline: one page, no reuse, and no two extra round trips to come up. -->
<style>
  html, body { margin: 0; height: 100%; }
  html { background: #f2ede2; }
  body { display: flex; align-items: center; justify-content: center; }
  /* Tiled right only once the page has a size, so it comes up with the page. */
  #paper { position: fixed; inset: 0; z-index: -1; background: url(/paper.png); opacity: 0; }
  #paper.up { opacity: 1; }
  /* The incoming page, centred by the collage's own rules; never eats a click. */
  #over { position: fixed; inset: 0; display: flex; align-items: center; justify-content: center; pointer-events: none; }
  img { max-width: 100%; max-height: 100vh; object-fit: contain; }
  .fade { animation: in 3s ease-in-out; }
  @keyframes in { from { opacity: 0; } }
  p { font: 1rem/1.5 system-ui, sans-serif; color: #8a8880; text-align: center; }
  p a { color: inherit; }
  /* Chrome for whoever is standing at the frame; a still room gets the birds back. */
  #chrome { position: fixed; right: 1rem; bottom: 1rem; display: flex; gap: 1rem; padding: .5rem .9rem; border-radius: 999px; background: #f2ede2; border: 1px solid #ddd6c6; font: .8rem/1 system-ui, sans-serif; opacity: 0; pointer-events: none; transition: opacity .4s ease-in-out; }
  #chrome.up { opacity: 1; pointer-events: auto; }
  #chrome a { color: #6d6a62; text-decoration: none; }
  #chrome a:hover, #chrome a:focus { color: #2e2c28; text-decoration: underline; }
  /* Reduced motion: still out of the way, just without the fade. */
  .still #chrome, .still #card { transition: none; }
  /* Who that bird is, for whoever is standing at the frame. Follows the pointer,
     so it is placed from script; only its look is here. */
  #card { position: fixed; left: 0; top: 0; max-width: 16rem; padding: .5rem .7rem; border-radius: .4rem; background: #f2ede2; border: 1px solid #ddd6c6; font: .85rem/1.35 system-ui, sans-serif; color: #2e2c28; opacity: 0; pointer-events: none; transition: opacity .2s ease-in-out; }
  #card.up { opacity: 1; }
  #card b { font-weight: 600; font-style: italic; }
  #card small { display: block; margin-top: .2rem; color: #6d6a62; font-style: normal; }
  /* Only where there is a bird to point at, so bare paper still reads as paper. */
  #collage.pointing { cursor: pointer; }
</style>
</head>
<body>
<div id="paper"></div>
<img id="collage" src="/collage.png" alt="Birds seen recently" hidden>
<p id="waiting" hidden>Waiting for BirdNET-Go<br><a href="/admin">Configure it in the admin panel</a></p>
<div id="over"></div>
<nav id="chrome">
  <a href="/admin">Admin</a>
  <a id="birdnet" href="/admin">BirdNET-Go</a>
  <a id="docs" href="/admin">Help</a>
</nav>
<div id="card" role="status"></div>
<noscript><p>Fugleramme needs JavaScript to run in a browser.</p></noscript>
<script>
  const DELAY = 5000;  // /state is one query, no render
  const collage = document.getElementById("collage");
  const paper = document.getElementById("paper");
  const over = document.getElementById("over");
  const waiting = document.getElementById("waiting");
  // Only ever seen before the first render: once a page exists the server holds
  // it through an outage, so a blip leaves the birds up rather than a message.
  const show = (page) => { collage.hidden = !page; waiting.hidden = page; };
  const TILE = 512;  // render/paper.py TILE
  // Match the page's corner and scale, so its paper runs on past the edge.
  const fitPaper = () => {
    if (!collage.naturalHeight || !collage.clientHeight) return;
    const box = collage.getBoundingClientRect();
    paper.style.backgroundSize = TILE * box.height / collage.naturalHeight + "px";
    paper.style.backgroundPosition = box.left + "px " + box.top + "px";
  };
  const calm = matchMedia("(prefers-reduced-motion: reduce)");
  // Hidden until it loads, so the first page fades in like an update.
  collage.onload = () => {
    const reveal = collage.hidden && !calm.matches;
    show(true);
    fitPaper();
    paper.className = reveal ? "up fade" : "up";
    if (!reveal) return;
    collage.className = "fade";
    collage.onanimationend = () => { paper.className = "up"; collage.className = ""; };
  };
  addEventListener("resize", fitPaper);
  fitPaper();
  collage.onerror = () => show(false);
  // Crossfade in place; a new page shape moves the paper too, so that snaps.
  const swap = (next) => {
    const reshaped = next.naturalWidth * collage.naturalHeight !== next.naturalHeight * collage.naturalWidth;
    if (collage.hidden || reshaped || calm.matches) { collage.src = next.src; return; }
    next.className = "fade";
    next.alt = "";
    next.onanimationend = () => { collage.src = next.src; collage.decode().finally(() => next.remove()); };
    over.append(next);
  };
  const chrome = document.getElementById("chrome");
  const IDLE = 3000;
  let idle = null;
  const wake = () => {
    chrome.classList.add("up");
    clearTimeout(idle);
    idle = setTimeout(() => chrome.classList.remove("up"), IDLE);
  };
  if (calm.matches) document.body.classList.add("still");
  addEventListener("pointermove", wake);
  addEventListener("touchstart", wake, {passive: true});
  chrome.addEventListener("focusin", wake);  // hidden is still tabbable
  // Re-read every poll: the admin can point the frame at another detector.
  const links = (state) => {
    document.getElementById("birdnet").href = state.birdnetPort
      ? location.protocol + "//" + location.hostname + ":" + state.birdnetPort + "/"
      : state.birdnetUrl;
    document.getElementById("docs").href = state.docsUrl;
  };
  // Point at a bird to read who it is (#54). The boxes come from the same
  // packing the page was drawn with, in the image's own pixels.
  const card = document.getElementById("card");
  let birds = [];
  let held = null;  // the bird the card is open on
  const hide = () => { card.classList.remove("up"); held = null; };

  // The image is object-fit: contain, so it sits letterboxed inside its own box.
  const toImage = (event) => {
    const box = collage.getBoundingClientRect();
    if (!collage.naturalWidth || !box.width) return null;
    const scale = Math.min(box.width / collage.naturalWidth, box.height / collage.naturalHeight);
    return {
      x: (event.clientX - box.left - (box.width - collage.naturalWidth * scale) / 2) / scale,
      y: (event.clientY - box.top - (box.height - collage.naturalHeight * scale) / 2) / scale,
    };
  };

  // Backwards: the packer draws biggest-first, so a later bird is the one on top.
  const under = (at) => {
    for (let i = birds.length - 1; i >= 0; i--) {
      const [x0, y0, x1, y1] = birds[i].box;
      if (at.x >= x0 && at.x < x1 && at.y >= y0 && at.y < y1) return birds[i];
    }
    return null;
  };

  const MARGIN = 12;
  const place = (event) => {
    // Flip to the other side rather than run off the edge.
    const box = card.getBoundingClientRect();
    const x = event.clientX + MARGIN + box.width > innerWidth ? event.clientX - MARGIN - box.width : event.clientX + MARGIN;
    const y = event.clientY + MARGIN + box.height > innerHeight ? event.clientY - MARGIN - box.height : event.clientY + MARGIN;
    card.style.transform = "translate(" + Math.max(0, x) + "px," + Math.max(0, y) + "px)";
  };

  const point = (event) => {
    const at = toImage(event);
    const bird = at && under(at);
    collage.classList.toggle("pointing", !!bird);
    if (!bird) return hide();
    if (bird !== held) {
      held = bird;
      card.innerHTML = "";
      const name = document.createElement("b");
      name.textContent = bird.label;
      card.append(name);
      if (bird.plate) {
        const note = document.createElement("small");
        note.textContent = bird.plate;
        card.append(note);
      }
    }
    place(event);
    card.classList.add("up");
  };
  addEventListener("pointermove", point);
  addEventListener("pointerdown", (e) => { if (e.pointerType !== "mouse") point(e); });
  addEventListener("keydown", (e) => { if (e.key === "Escape") hide(); });
  addEventListener("blur", hide);

  let token = null;
  async function tick() {
    try {
      const state = await (await fetch("/state", {cache: "no-store"})).json();
      links(state);
      if (state.token !== token) {
        token = state.token;
        hide();
        birds = [];  // stale the moment the page changes
        const next = new Image();  // decode before swapping, so the frame never blanks
        next.onload = () => swap(next);
        next.src = "/collage.png?v=" + encodeURIComponent(token);
        const found = await (await fetch("/regions?v=" + encodeURIComponent(token), {cache: "no-store"})).json();
        if (found.token === token) birds = found.birds;  // else the page moved again
      }
    } catch (e) {}  // transient: retry next tick
    setTimeout(tick, DELAY);
  }
  tick();
</script>
</body>
</html>
